<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're offline · Book Swap</title>
<style>
:root{--bg:#F1EBFF;--ink:#1D0F33;--muted:#5E4F7A;--pink:#FF4F81;--edge:#1D0F33;--surface:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#140A24;--ink:#F4EEFF;--muted:#B9ACD6;--edge:#000;--surface:#21143A}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:18px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px;box-sizing:border-box}
main{max-width:340px;text-align:center}
h1{font-size:2.4rem;line-height:1;margin:0 0 12px;letter-spacing:-.03em}
p{color:var(--muted);margin:0 0 22px}
button{font:inherit;font-weight:800;background:var(--pink);color:#1D0F33;border:2.5px solid var(--edge);border-radius:14px;padding:12px 22px;box-shadow:3px 3px 0 var(--edge);min-height:50px}
</style></head>
<body><main><h1>You're offline</h1><p>Book Swap needs the internet to show the latest books. Check your Wi-Fi or mobile data, then try again.</p>
<button onclick="location.reload()">Try again</button></main></body></html>
